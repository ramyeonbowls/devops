# ============================================================
# LogPulse - Docker Compose
#
# Services:
#   logpulse-backend  - Go API + SQLite (port 8080 internal)
#   logpulse-frontend - Static React build (port 80 internal)
#   dbx               - t8y2/dbx:latest
#   caddy             - Reverse proxy        (port 80 / 443 public)
#
# All Docker config lives here at /devops/ (not inside /devops/logs/)
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Go backend
  # ----------------------------------------------------------
  logpulse-backend:
    build:
      context: ./logs/backend
      dockerfile: Dockerfile
    container_name: logpulse-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATA_DIR: /app/data
      LOG_ALLOWED_ROOTS: ${LOG_ALLOWED_ROOTS:-/var/log,/app/data}
      PROMETHEUS_METRICS_TOKEN_FILE: /run/secrets/prometheus_metrics_token
    secrets:
      - prometheus_metrics_token
    volumes:
      - logpulse-data:/app/data
    networks:
      - logpulse-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # 2. Static React frontend; API requests are routed directly to Go by Caddy.
  # ----------------------------------------------------------
  logpulse-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: logpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - logpulse-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # 3. DBX
  # ----------------------------------------------------------
  dbx:
    image: t8y2/dbx:latest
    container_name: logpulse-dbx
    restart: unless-stopped
    ports:
      - "4224:4224"
    environment:
      DBX_DATA_DIR: /app/data
      DBX_PASSWORD: ${DBX_PASSWORD}
      DBX_DISABLE_PASSWORD_VIEWER: "true"
    volumes:
      - dbx-data:/app/data
      - logpulse-data:/logpulse-data:ro
    networks:
      - logpulse-net

  # ----------------------------------------------------------
  # 4. Prometheus scrapes the private, token-protected Go metrics endpoint.
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: logpulse-prometheus
    restart: unless-stopped
    group_add:
      - "${PROMETHEUS_SECRET_GID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - prometheus_metrics_token
    networks:
      - logpulse-net
    depends_on:
      logpulse-backend:
        condition: service_healthy

  # ----------------------------------------------------------
  # 5. Grafana dashboards, served through Caddy only.
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.4
    container_name: logpulse-grafana
    restart: unless-stopped
    group_add:
      - "${PROMETHEUS_SECRET_GID:-1000}"
    environment:
      GF_SERVER_ROOT_URL: https://grafana.cloudeskaerp.test/
      GF_SERVER_DOMAIN: grafana.cloudeskaerp.test
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    networks:
      - logpulse-net
    depends_on:
      - prometheus

  # ----------------------------------------------------------
  # 6. Caddy reverse proxy
  # ----------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: logpulse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway" # <-- Tambahkan ini
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - logpulse-net
    depends_on:
      logpulse-frontend:
        condition: service_healthy
      logpulse-backend:
        condition: service_healthy
      grafana:
        condition: service_started

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  logpulse-data:
    driver: local
  dbx-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

secrets:
  prometheus_metrics_token:
    file: ./.secrets/prometheus_metrics_token
  grafana_admin_password:
    file: ./.secrets/grafana_admin_password

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  logpulse-net:
    name: devops_logpulse-net
    external: true
